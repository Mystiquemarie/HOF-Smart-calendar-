
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOF Smart Calendar Elite V6.1</title>

<style>
:root {
  --pink: #ff61b4;
  --pale: #ffe4f2;
  --gold: #e9bb62;
  --ink: #1c0d1c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: #fff4fa;
  font-family: Georgia, "Times New Roman", serif;
  background:
    repeating-linear-gradient(
      45deg,
      transparent 0 28px,
      #ffffff0a 29px 31px,
      transparent 32px 60px
    ),
    repeating-linear-gradient(
      -45deg,
      transparent 0 28px,
      #ffffff0a 29px 31px,
      transparent 32px 60px
    ),
    #190d1b;
}

header {
  text-align: center;
  padding: 17px 12px 15px;
  border-bottom: 4px double var(--gold);
  background: radial-gradient(
    ellipse at 50% 0%,
    #ff9dd5 0%,
    #b71f71 35%,
    #330c2d 75%,
    #170d19 100%
  );
  box-shadow: 0 6px 20px #0009;
}

.brand {
  font-size: clamp(25px, 3.5vw, 49px);
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff0f8;
  text-shadow:
    0 2px #ad2870,
    2px 4px #3d0d2b,
    0 0 12px #ffb4df;
}

.script {
  font-size: clamp(20px, 3vw, 36px);
  font-style: italic;
  color: #ffc5e4;
  text-shadow: 0 0 8px #ff56a8;
  margin: -2px 0 5px;
}

.subtitle {
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  color: #ffe5b6;
}

.clock {
  font: 13px Arial, sans-serif;
  margin-top: 10px;
  color: white;
}

.bow {
  display: inline-block;
  color: #ff7fbc;
  text-shadow: 0 1px #74224c, 0 0 7px #ffd0e7;
  font-size: 1.1em;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 4fr) minmax(220px, 1fr);
  gap: 14px;
  padding: 14px;
  align-items: start;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.month,
.sidebar {
  min-width: 0;
  border: 2px solid var(--gold);
  border-radius: 14px;
  background: linear-gradient(
    145deg,
    #fa9dcb 0%,
    #ee4f9e 12%,
    #3b1437 13%,
    #230f26 100%
  );
  box-shadow:
    inset 0 0 0 2px #ffb9df,
    0 4px 10px #0009;
  overflow: hidden;
}

.month h2 {
  margin: 0;
  padding: 11px 3px 9px;
  text-align: center;
  font-size: clamp(12px, 1.25vw, 18px);
  background: linear-gradient(
    #ffacd8,
    #f456a6 55%,
    #b3226d
  );
  color: #fff8e6;
  text-shadow: 1px 2px #7c174b;
  border-bottom: 2px solid var(--gold);
}

.month h2::before {
  content: "🎀 ";
  font-size: .85em;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 2px;
  padding: 7px 5px 9px;
  background: linear-gradient(#fff1f7, #ffd5e9);
}

.weekday {
  text-align: center;
  color: #98245e;
  font: bold 10px Arial, sans-serif;
  padding: 4px 0;
}

.day {
  min-width: 0;
  aspect-ratio: 1.1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff5fa;
  border: 1px solid #e8a4c5;
  color: #64264b;
  border-radius: 2px;
  font: clamp(9px, .9vw, 13px) Arial, sans-serif;
  cursor: pointer;
}

.day:hover,
.day:focus-visible {
  background: #ff70b7;
  color: #270c20;
  outline: 2px solid var(--gold);
}

.today {
  background: #ff6bad;
  color: #fff;
  border: 2px solid #ae7926;
  font-weight: bold;
}

.empty {
  background: transparent;
  border-color: transparent;
  cursor: default;
}

.sidebar {
  position: sticky;
  top: 12px;
  padding: 13px;
  background: linear-gradient(#481537, #200f23);
}

.sidebar h2 {
  text-align: center;
  margin: 4px 0 14px;
  font-size: 23px;
  color: #ffd1e8;
  text-shadow: 0 0 8px #ff64b3;
}

.sidebar h2::before {
  content: "💖 ";
  font-size: .8em;
}

.event {
  background: linear-gradient(110deg, #ffe1ef, #f8a8cd);
  color: #5c1640;
  border: 2px solid var(--gold);
  border-radius: 12px;
  margin: 10px 0;
  padding: 12px;
  font: 14px Arial, sans-serif;
}

.event small {
  display: block;
  margin-top: 6px;
}

.sidebar button,
.popup-box button {
  background: linear-gradient(#ffd1e9, #f05da7);
  border: 2px solid var(--gold);
  border-radius: 9px;
  padding: 10px 12px;
  color: #4b1235;
  font: bold 13px Arial, sans-serif;
  cursor: pointer;
  width: 100%;
  margin: 8px 0;
}

.sidebar p {
  font: 12px/1.5 Arial, sans-serif;
  color: #f9d5e8;
}

.sidebar button:hover,
.popup-box button:hover {
  filter: brightness(1.1);
}

footer {
  text-align: center;
  color: var(--gold);
  font: 12px Arial, sans-serif;
  padding: 14px;
}

#popup {
  display: none;
  position: fixed;
  inset: 0;
  background: #130815d9;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 16px;
}

.popup-box {
  width: min(100%, 430px);
  padding: 24px;
  text-align: center;
  border: 3px double var(--gold);
  border-radius: 18px;
  background: linear-gradient(#8b255d, #2c122c);
  box-shadow: 0 0 30px #000;
}

.popup-box h2 {
  color: #ffe2f2;
}

.popup-box p {
  font: 15px/1.5 Arial, sans-serif;
  white-space: pre-line;
}

@media (max-width: 1100px) {
  .calendar {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 700px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .calendar {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sidebar {
    position: static;
  }
}

@media (max-width: 420px) {
  .calendar {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <span class="bow">🎀</span>
    HOF SMART CALENDAR
    <span class="bow">🎀</span>
  </div>

  <div class="script">Luxury Calendar</div>

  <div class="subtitle">
    HOUSE OF FIERCE CREATIONS · ELITE V6.1
  </div>

  <div id="clock" class="clock"></div>
</header>

<div class="layout">

  <main
    id="calendar"
    class="calendar"
    aria-label="Ten-month calendar">
  </main>

  <aside class="sidebar">
    <h2>Upcoming Events</h2>

    <div id="events"></div>

    <button type="button" id="scheduleButton">
      💌 View Upcoming Schedule
    </button>

    <p>
      💗 Public events appear here.
      Private invitations will require verified access
      when event services are connected.
    </p>
  </aside>

</div>

<div
  id="popup"
  role="dialog"
  aria-modal="true"
  aria-labelledby="popupTitle">

  <div class="popup-box">
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>

    <button id="closeButton" type="button">
      Close
    </button>
  </div>

</div>

<footer>
  💎 HOUSE OF FIERCE CREATIONS · FIERCELY MADE 💎
</footer>

<script>
"use strict";

const calendar = document.getElementById("calendar");
const eventContainer = document.getElementById("events");
const popup = document.getElementById("popup");

const weekdays = ["S", "M", "T", "W", "T", "F", "S"];

const months = [
  "January", "February", "March", "April",
  "May", "June", "July", "August",
  "September", "October", "November", "December"
];

// Real event storage will be connected later.
// Never place private event data in public GitHub Pages code.
const publicEvents = [];

function key(y, m, d) {
  return (
    y + "-" +
    String(m + 1).padStart(2, "0") + "-" +
    String(d).padStart(2, "0")
  );
}

function renderCalendar() {
  calendar.replaceChildren();

  const now = new Date();

  for (let offset = 0; offset < 10; offset++) {
    const first = new Date(
      now.getFullYear(),
      now.getMonth() + offset,
      1
    );

    const y = first.getFullYear();
    const m = first.getMonth();

    const box = document.createElement("section");
    box.className = "month";

    const heading = document.createElement("h2");
    heading.textContent = months[m] + " " + y;
    box.append(heading);

    const grid = document.createElement("div");
    grid.className = "days";

    weekdays.forEach(w => {
      const el = document.createElement("div");
      el.className = "weekday";
      el.textContent = w;
      grid.append(el);
    });

    for (let i = 0; i < first.getDay(); i++) {
      const el = document.createElement("div");
      el.className = "day empty";
      grid.append(el);
    }

    const count = new Date(y, m + 1, 0).getDate();

    for (let d = 1; d <= count; d++) {
      const el = document.createElement("button");

      el.type = "button";
      el.className = "day";
      el.textContent = d;

      el.setAttribute(
        "aria-label",
        months[m] + " " + d + ", " + y
      );

      if (
        y === now.getFullYear() &&
        m === now.getMonth() &&
        d === now.getDate()
      ) {
        el.classList.add("today");
      }

      el.addEventListener("click", () => {
        openDate(key(y, m, d));
      });

      grid.append(el);
    }

    box.append(grid);
    calendar.append(box);
  }
}

function showPopup(title, message) {
  document.getElementById("popupTitle").textContent = title;
  document.getElementById("popupText").textContent = message;

  popup.style.display = "flex";
}

function openDate(date) {
  const matches = publicEvents.filter(event => {
    return event.date === date;
  });

  const message = matches.length
    ? matches.map(event => event.title).join("\n")
    : "No public events scheduled for this date.";

  showPopup("🎀 " + date, message);
}

function renderEvents() {
  eventContainer.replaceChildren();

  if (!publicEvents.length) {
    const card = document.createElement("div");
    card.className = "event";

    const title = document.createElement("strong");
    title.textContent = "No upcoming events yet";

    const sub = document.createElement("small");
    sub.textContent =
      "Events will appear when scheduling is connected.";

    card.append(title, sub);
    eventContainer.append(card);

    return;
  }

  publicEvents.forEach(event => {
    const card = document.createElement("div");
    card.className = "event";

    card.textContent =
      event.title + " — " + event.date;

    eventContainer.append(card);
  });
}

function showSchedule() {
  const message = publicEvents.length
    ? publicEvents.map(event => {
        return event.title + " — " + event.date;
      }).join("\n")
    : "There are no public events scheduled yet.";

  showPopup("💗 Upcoming Schedule", message);
}

function updateClock() {
  const now = new Date();

  function formatTime(timezone) {
    return new Intl.DateTimeFormat("en-US", {
      timeZone: timezone,
      dateStyle: "medium",
      timeStyle: "short"
    }).format(now);
  }

  document.getElementById("clock").textContent =
    "💗 Eastern: " + formatTime("America/New_York") +
    "  |  👑 SLT: " + formatTime("America/Los_Angeles");
}

document.getElementById("scheduleButton")
  .addEventListener("click", showSchedule);

document.getElementById("closeButton")
  .addEventListener("click", () => {
    popup.style.display = "none";
  });

popup.addEventListener("click", event => {
  if (event.target === popup) {
    popup.style.display = "none";
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    popup.style.display = "none";
  }
});

renderCalendar();
renderEvents();
updateClock();

setInterval(updateClock, 30000);
setInterval(renderCalendar, 60000);
</script>

</body>
</html>
